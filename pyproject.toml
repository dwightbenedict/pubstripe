[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "pubstripe"
version = "0.2.0a1"
description = "Process payments via Stripe’s API using only a publishable key."
readme = "README.md"
authors = [
    { name = "Dwight Langston" }
]
requires-python = ">=3.13"
dependencies = [
    "curl-cffi>=0.14.0,<1.0.0",
    "tenacity>=9.1.4,<10.0.0",
    "pydantic>=2.12.5,<3.0.0",
    "faker>=40.0.0,<41.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]
include = ["pubstripe*"]
